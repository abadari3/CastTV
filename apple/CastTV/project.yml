name: CastTV
options:
  bundleIdPrefix: com.casttv
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  xcodeVersion: "16.3"

packages:
  CastTVShared:
    path: ../CastTVShared
  FFmpegKit:
    path: ../FFmpegKit

targets:
  CastTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - package: CastTVShared
      - package: FFmpegKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casttv.ios
        PRODUCT_NAME: CastTV
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "CastTV needs camera access to scan QR codes for pairing with Apple TV"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "CastTV uses the local network to discover nearby TVs for quick pairing"
        INFOPLIST_KEY_NSBonjourServices:
          - "_casttv._tcp"

  CastTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: tvOS
    dependencies:
      - package: CastTVShared
      - package: FFmpegKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casttv.tvos
        PRODUCT_NAME: CastTV
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "CastTV uses the local network to allow iPhones to discover this TV"
        INFOPLIST_KEY_NSBonjourServices:
          - "_casttv._tcp"
