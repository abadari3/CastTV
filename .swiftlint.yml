included:
  - apple/CastTVShared/Sources
  - apple/CastTV/iOS
  - apple/CastTV/tvOS

excluded:
  - apple/CastTV/build
  - apple/FFmpegKit
  - .build

disabled_rules:
  - line_length
  - file_length
  - function_body_length
  - type_body_length
  - identifier_name
  - nesting
  - todo
  - large_tuple
