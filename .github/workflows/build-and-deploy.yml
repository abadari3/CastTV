name: Build & Deploy

on:
  push:
    tags: ['v*']

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-apple:
    name: Build iOS & tvOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg xcframework
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: apple/FFmpegKit/Frameworks/FFmpeg.xcframework
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple/CastTV
        run: xcodegen

      - name: Build iOS
        working-directory: apple/CastTV
        run: |
          xcodebuild build \
            -project CastTV.xcodeproj \
            -scheme CastTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData-iOS \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package iOS IPA
        run: |
          APP_PATH=$(find apple/CastTV/build/DerivedData-iOS -name "CastTV.app" -path "*/Release-iphoneos/*" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CastTV-iOS.ipa Payload
          rm -rf Payload

      - name: Build tvOS
        working-directory: apple/CastTV
        run: |
          xcodebuild build \
            -project CastTV.xcodeproj \
            -scheme CastTV-tvOS \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath build/DerivedData-tvOS \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package tvOS IPA
        run: |
          APP_PATH=$(find apple/CastTV/build/DerivedData-tvOS -name "CastTV.app" -path "*/Release-appletvos/*" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CastTV-tvOS.ipa Payload
          rm -rf Payload

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: apple-ipas
          path: |
            CastTV-iOS.ipa
            CastTV-tvOS.ipa

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-worker, build-android, build-apple]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download Apple IPAs
        uses: actions/download-artifact@v4
        with:
          name: apple-ipas
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            **Artifacts:**
            - `CastTV-iOS.ipa` — unsigned iOS app
            - `CastTV-tvOS.ipa` — unsigned tvOS app
            - `*.apk` — Android TV app
          files: artifacts/*
