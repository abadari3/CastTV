name: CI Android

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  workflow_call:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease
