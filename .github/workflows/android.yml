name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/android.yml'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: ktlint
        working-directory: android
        run: ./gradlew ktlintCheck

      - name: Unit tests
        working-directory: android
        run: ./gradlew test

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastTV-AndroidTV-apk
          path: android/app/build/outputs/apk/release/CastTV-AndroidTV.apk
          retention-days: 7

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CastTV-AndroidTV-apk
          path: .

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: CastTV-AndroidTV.apk
