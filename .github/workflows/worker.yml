name: Worker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
              - '.github/workflows/worker.yml'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.worker == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Prettier check
        working-directory: worker
        run: npm run lint

      - name: Run tests
        working-directory: worker
        run: npm test

  release:
    name: Deploy
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          set -e
          echo "GET / ..."
          curl -fsS https://cast.anandabadari.com/ > /dev/null
          echo "GET /room/AAAAAA/status ..."
          BODY=$(curl -fsS https://cast.anandabadari.com/room/AAAAAA/status)
          echo "$BODY" | jq -e '.appleTvConnected != null' > /dev/null
          echo "Smoke checks passed."
