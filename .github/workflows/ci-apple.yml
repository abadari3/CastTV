name: CI Apple

on:
  push:
    branches: ['**']
    paths:
      - 'apple/**'
      - 'scripts/build-ffmpeg.sh'
      - '.github/workflows/ci-apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'scripts/build-ffmpeg.sh'
      - '.github/workflows/ci-apple.yml'
  workflow_call:

jobs:
  build:
    name: Build iOS & tvOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg xcframework
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: apple/FFmpegKit/Frameworks/FFmpeg.xcframework
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple/CastTV
        run: xcodegen

      - name: Build iOS
        working-directory: apple/CastTV
        run: |
          xcodebuild build \
            -project CastTV.xcodeproj \
            -scheme CastTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData-iOS \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build tvOS
        working-directory: apple/CastTV
        run: |
          xcodebuild build \
            -project CastTV.xcodeproj \
            -scheme CastTV-tvOS \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath build/DerivedData-tvOS \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
